<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointage RSU 2026</title>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #222; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 3px 15px rgba(0,0,0,0.12); }
        h1 { text-align: center; font-size: 22px; margin-bottom: 20px; color: #1976d2; }
        .user-header { display: flex; justify-content: space-between; align-items: center; background: #e3f0ff; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .action { display: flex; align-items: center; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; font-size: 16px; }
        .action input { margin-right: 12px; transform: scale(1.3); }
        button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 10px; background: #1976d2; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #aaa; }
        button.logout { background: #ffffff; color: #d32f2f; border: 2px solid #d32f2f; border-radius: 8px; font-size: 16px; font-weight: bold; padding: 4px 10px; width: auto; cursor: pointer; }
        button.logout:hover { background: #d32f2f; color: #ffffff; }
        #reader { width: 100%; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        #message, .message { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; }
        .success { background: #dff5e3; color: #176b2c; }
        .error { background: #fde0e0; color: #9b1c1c; }
        .info { background: #e3f0ff; color: #145a9e; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- ÉCRAN CONNEXION -->
    <div id="loginScreen">
        <h1>Connexion Responsable</h1>
        <div class="input-group">
            <label for="username">Identifiant / Login :</label>
            <input type="text" id="username" placeholder="Entrez votre identifiant">
        </div>
        <div class="input-group">
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" placeholder="Entrez votre mot de passe">
        </div>
        <button id="loginBtn">SE CONNECTER</button>
        <div id="loginError" class="message error hidden"></div>
    </div>

    <!-- ÉCRAN PRINCIPAL -->
    <div id="appScreen" class="hidden">
        <div class="user-header">
            <span>👤 <strong><span id="displayUser"></span></strong></span>
            <button id="logoutBtn" class="logout" title="Déconnexion">❌</button>
        </div>

        <h1>Fiche de Présence RSU</h1>

        <div style="font-weight: bold; margin-bottom: 10px;">Type d'action :</div>
        <label class="action">
            <input type="radio" name="action" value="IN" checked> Check-in (Entrée / Arrivée)
        </label>
        <label class="action">
            <input type="radio" name="action" value="OUT"> Check-out (Sortie / Départ)
        </label>

        <button id="scanButton">📷 SCANNER LE QR CODE</button>

        <div id="message" class="hidden"></div>
        <div id="reader" class="hidden"></div>
    </div>

</div>

<script>
    const KOBO_URL = "https://ee.kobotoolbox.org/fzFDr1H6";
    const PREFIXE_ATTENDU = "RSU2026_vague_2";
    const NB_CHAMPS_A_CONSERVER = 6;

    const USERS = {
        "admin01": "pass123",
        "resp_nord": "rsu2026",
        "supervisor": "secure2026"
    };

    let currentUser = localStorage.getItem("resp_user") || null;
    let html5QrCode = null;

    window.addEventListener("DOMContentLoaded", () => {
        if (currentUser) {
            showAppScreen();
        } else {
            showLoginScreen();
        }

        // Gestion du retour après validation dans Kobo
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("status") === "submitted" && currentUser) {
            window.history.replaceState({}, document.title, window.location.pathname);
            
            setTimeout(() => {
                const reponse = confirm(
                    "Fiche de présence enregistrée avec succès !\n\n" +
                    "Voulez-vous scanner un autre QR Code ?\n\n" +
                    "• OK = Oui (Relancer le scanner)\n" +
                    "• Annuler = Non (Terminer)"
                );

                if (reponse) {
                    démarrerScanner();
                } else {
                    showMessage("Session de pointage terminée.", "info");
                    document.getElementById("scanButton").disabled = false;
                }
            }, 150);
        }
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();
        const errDiv = document.getElementById("loginError");

        if (USERS[u] && USERS[u] === p) {
            currentUser = u;
            localStorage.setItem("resp_user", u);
            errDiv.classList.add("hidden");
            showAppScreen();
        } else {
            errDiv.textContent = "Identifiant ou mot de passe incorrect.";
            errDiv.classList.remove("hidden");
        }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("resp_user");
        currentUser = null;
        showLoginScreen();
    });

    function showLoginScreen() {
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("appScreen").classList.add("hidden");
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    function showAppScreen() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");
        document.getElementById("displayUser").textContent = currentUser;
    }

    function showMessage(text, type = "info") {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "";
        message.classList.add(type);
    }

    function traiterQRCode(qrText) {
        let sepEffectif = qrText.includes(";") ? ";" : "|";
        let elements = qrText.split(sepEffectif);

        if (elements[0].trim() !== PREFIXE_ATTENDU) {
            showMessage("QR code invalide, veuillez trouver le vrai QR code.", "error");
            document.getElementById("scanButton").disabled = false;
            return;
        }

        elements.shift();

        if (elements.length < NB_CHAMPS_A_CONSERVER) {
            showMessage("QR Code invalide : informations insuffisantes.", "error");
            document.getElementById("scanButton").disabled = false;
            return;
        }

        const elementsPropres = elements.map(item => item.trim().replace(/\s+/g, "_"));
        const donneesPropres = elementsPropres.slice(0, NB_CHAMPS_A_CONSERVER).join(" ");

        // Récupération dynamique du bouton radio coché (IN ou OUT)
        const actionTypeChecked = document.querySelector('input[name="action"]:checked').value;
        
        // Construction de l'URL de retour vers la page HTML d'origine
        const urlRetourHTML = window.location.origin + window.location.pathname + "?status=submitted";

        // Construction du lien Enketo avec les paramètres pré-remplis
        const targetUrl = new URL(KOBO_URL);
        targetUrl.searchParams.append("d[qr_code_raw]", donneesPropres);
        targetUrl.searchParams.append("d[action_type]", actionTypeChecked);
        targetUrl.searchParams.append("d[responsable_login]", currentUser);
        targetUrl.searchParams.append("returnUrl", urlRetourHTML);

        showMessage("Redirection vers le formulaire...", "success");
        window.location.href = targetUrl.toString();
    }

    function démarrerScanner() {
        const reader = document.getElementById("reader");
        reader.classList.remove("hidden");
        document.getElementById("scanButton").disabled = true;

        showMessage("Autorisez la caméra et présentez le QR Code.", "info");

        html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                    traiterQRCode(decodedText);
                }).catch(() => {
                    traiterQRCode(decodedText);
                });
            },
            () => {}
        ).catch((err) => {
            console.error(err);
            showMessage("Impossible d'accéder à la caméra.", "error");
            document.getElementById("scanButton").disabled = false;
        });
    }

    document.getElementById("scanButton").addEventListener("click", démarrerScanner);
</script>

</body>
</html>
